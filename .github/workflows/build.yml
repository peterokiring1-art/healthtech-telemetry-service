name: Cloud Android APK Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 🔒 SHA-Pinned securely to checkout@v4.1.7 reference signature
    - name: Checkout Repository Source Code
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

    # 🔒 SHA-Pinned securely to setup-java@v4.2.2 reference signature
    - name: Set Up Java JDK 17
      uses: actions/setup-java@6a0805f75e37b5997aaf883b8084c307235088d0
      with:
        distribution: 'temurin'
        java-version: '17'

    # 🔒 SHA-Pinned securely to setup-python@v5.2.0 reference signature
    - name: Set Up Python 3.10
      uses: actions/setup-python@f67e1a58e734b0d19e01589a537f8f342aa7fd3b
      with:
        python-version: '3.10'

    - name: Install System Packaging Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    - name: Install Buildozer Wrapper
      run: |
        pip install --upgrade pip
        pip install buildozer cython Kivy

    - name: Compile Standalone Offline APK Binary
      run: |
        buildozer android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "y"

    # 🔒 SHA-Pinned securely to upload-artifact@v4.4.0 reference signature
    - name: Upload Finished APK Asset Artifact
      uses: actions/upload-artifact@6043d90f3112e60c550342f5177fc80cb7a231f1
      with:
        name: Hass-Biomedical-Offline-APK
        path: bin/*.apk
