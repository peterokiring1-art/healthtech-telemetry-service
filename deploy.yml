name: HealthTech Telemetry DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ] # Triggers every time you push to master tracking branches

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest # Executes inside a secure, cloud-managed Linux instance

    services:
      # Spin up ephemeral backend instances to run our integration suite
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres_secure_2026
          POSTGRES_DB: healthtech_telemetry
        ports:
          - 5432:5432

    steps:
    - name: Check out source code repository
      uses: actions/checkout@v3

    - name: Set up runtime Python execution environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Pre-build and cache core machine learning weights
      run: |
        python -m pip install --upgrade pip
        pip install torch==2.14.0 scipy==1.18.1 numpy==2.5.3
        pip install -r requirements.txt

    - name: Execute automated unit contract tests
      run: |
        pytest --tb=short

    - name: Compile and Verify Optimized Production Docker Images
      # This utilizes the remote cloud daemon infrastructure completely bypassing your PC!
      run: |
        docker build -t healthtech-gateway-core:latest .
        print("✅ Production Docker container compiled successfully without local dependencies.")
