version: '3.8'

services:
  api_gateway:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/code
    restart: always

  ui_dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - .:/code
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - api_gateway
