name: Cloud Android APK Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 🔒 SHA-Pinned securely to checkout@v4.1.7 reference signature
    - name: Checkout Repository Source Code
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

    # 🔒 SHA-Pinned securely to setup-java@v4.0.0 reference signature
    - name: Set Up Java JDK 17
      uses: actions/setup-java@3a430d4f7a37129bcbf40652eb9f2f61becf3332
      with:
        distribution: 'temurin'
        java-version: '17'

    # 🔒 SHA-Pinned securely to setup-python@v5.0.0 reference signature
    - name: Set Up Python 3.10
      uses: actions/setup-python@0a5c61591373683505ea898e09a341b572c219cd
      with:
        python-version: '3.10'

    - name: Install System Packaging Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    - name: Install Buildozer Wrapper
      run: |
        pip install --upgrade pip
        pip install buildozer cython Kivy

    - name: Compile Standalone Offline APK Binary
      run: |
        buildozer android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "y"

    # 🔒 SHA-Pinned securely to upload-artifact@v4.0.0 reference signature
    - name: Upload Finished APK Asset Artifact
      uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c617e9979466c1
      with:
        name: Hass-Biomedical-Offline-APK
        path: bin/*.apk
